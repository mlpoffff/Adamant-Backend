models:
  Media:
    id: id
    title: string nullable
    src: string
  PriceCategory:
    id: id
    title: string
    slug: string
  Price:
    id: id
    title: string
    description: text
    price: bigInteger
    category_id: unsignedBigInteger foreign:price_categories.id
  Personal:
    id: id
    fio: string
    description: string
    image_id: unsignedBigInteger foreign:media.id
  Article:
    id: id
    title: string
    content: text
  PersonalImage:
    id: id
    personal_id: unsignedBigInteger foreign:personal.id
    image_id: unsignedBigInteger foreign:media.id
  Gallery:
    id: id
    type: string
    image_id: unsignedBigInteger foreign:media.id
  Dms:
    id: id
    title: string
    link: string nullable
  Announce:
    id: id
    active: boolean
    description: string
  Document:
    id: id
    image_id: unsignedBigInteger foreign:media.id
  License:
    id: id
    license_text: string
  Schedule:
    id: id
    day: string
    time: string
  ContactNumber:
    id: id
    number: string
  Application:
    id: id
    status: string
    name: string
    surname: string
    phone_number: string
    email: string
    description: text
